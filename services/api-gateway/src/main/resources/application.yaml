server:
  port: 9000

spring:
  cloud:
    gateway:
      server:
        webmvc:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "http://localhost:5173"
                  - "http://localhost:3000"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: true
                max-age: 3600
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**

            - id: citizen-auth
              uri: http://localhost:8082
              predicates:
                - Path=/api/auth/**

            - id: citizen-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/citizens/**,/api/officers/**

            - id: grievance-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/grievances/**

            - id: grievance-service-meta
              uri: http://localhost:8083
              predicates:
                - Path=/api/meta/**

            - id: certificate-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/certificates/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/civicpulse