version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════════
# CivicPulse Nexus — Full Stack Docker Compose
# Usage:
#   docker compose up -d              → start everything
#   docker compose logs -f welfare-service  → tail logs
#   docker compose down -v            → stop + delete volumes
# ═══════════════════════════════════════════════════════════════════════════════

networks:
  civicpulse-net:
    driver: bridge

volumes:
  postgres-data:
  keycloak-data:
  kafka-data:
  uploads-data:

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: civicpulse-postgres
    environment:
      POSTGRES_DB: civicpulse_db
      POSTGRES_USER: ${DB_USER:-civicpulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - civicpulse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-civicpulse} -d civicpulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Keycloak ────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: civicpulse-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/civicpulse_db
      KC_DB_USERNAME: ${DB_USER:-civicpulse}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - civicpulse-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Kafka (KRaft, no ZooKeeper) ─────────────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    container_name: civicpulse-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    ports:
      - "9092:9092"
    networks:
      - civicpulse-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Citizen Service (8082) ──────────────────────────────────────────────────
  citizen-service:
    build:
      context: ../../services/citizen-service
      dockerfile: ../../docker/Dockerfile.springboot
    container_name: civicpulse-citizen
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/civicpulse_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-civicpulse}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: civicpulse
      KEYCLOAK_RESOURCE: civicpulse-client
      KEYCLOAK_CREDENTIALS_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - civicpulse-net
    restart: on-failure

  # ── Grievance Service (8083) ────────────────────────────────────────────────
  grievance-service:
    build:
      context: ../../services/grievance-service
      dockerfile: ../../docker/Dockerfile.springboot
    container_name: civicpulse-grievance
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/civicpulse_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-civicpulse}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: civicpulse
      KEYCLOAK_RESOURCE: civicpulse-client
      KEYCLOAK_CREDENTIALS_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - civicpulse-net
    restart: on-failure

  # ── Certificate Service (8084) ──────────────────────────────────────────────
  certificate-service:
    build:
      context: ../../services/certificate-service
      dockerfile: ../../docker/Dockerfile.springboot
    container_name: civicpulse-certificate
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/civicpulse_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-civicpulse}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: civicpulse
      KEYCLOAK_RESOURCE: civicpulse-client
      KEYCLOAK_CREDENTIALS_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - civicpulse-net
    restart: on-failure

  # ── Welfare Service (8085) ──────────────────────────────────────────────────
  welfare-service:
    build:
      context: ../../services/welfare-service
      dockerfile: ../../docker/Dockerfile.springboot
    container_name: civicpulse-welfare
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/civicpulse_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-civicpulse}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: civicpulse
      KEYCLOAK_RESOURCE: civicpulse-client
      KEYCLOAK_CREDENTIALS_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      # Replaces hardcoded C:\Project\uploads path!
      WELFARE_UPLOAD_PATH: /app/uploads/welfare-docs
    volumes:
      - uploads-data:/app/uploads
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - civicpulse-net
    restart: on-failure

  # ── API Gateway (9000) ──────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ../../services/api-gateway
      dockerfile: ../../docker/Dockerfile.springboot
    container_name: civicpulse-gateway
    environment:
      SERVER_PORT: 9000
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: civicpulse
      KEYCLOAK_RESOURCE: civicpulse-client
      KEYCLOAK_CREDENTIALS_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      # Gateway routes point to internal service names, not localhost
      CITIZEN_SERVICE_URL: http://citizen-service:8082
      GRIEVANCE_SERVICE_URL: http://grievance-service:8083
      CERTIFICATE_SERVICE_URL: http://certificate-service:8084
      WELFARE_SERVICE_URL: http://welfare-service:8085
    ports:
      - "9000:9000"
    depends_on:
      - citizen-service
      - grievance-service
      - certificate-service
      - welfare-service
    networks:
      - civicpulse-net
    restart: on-failure

  # ── Frontend (port 3000) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../../docker/Dockerfile.frontend
    container_name: civicpulse-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - civicpulse-net
    restart: on-failure
